name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Run strict TypeScript check
        run: npx tsc --noEmit

      - name: Run test TypeScript check
        run: npm run typecheck:tests

      - name: Run Expo production export
        run: EXPO_NO_TELEMETRY=1 npx expo export -p web

  database:
    name: Database & Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database and verify migrations
        run: supabase db reset

      - name: Run Supabase pgTAP database tests
        run: supabase test db

      - name: Run local integration E2E harness
        run: node scripts/test-i1-b1-local.mjs

      - name: Run local B2 routine integration E2E harness
        run: node scripts/test-i1-b2-local.mjs

      - name: Run S2 persistence API integration harness
        run: node scripts/test-s2-local.mjs

      - name: Run local B4B check-in context E2E harness
        run: node scripts/test-i1-b4b-local.mjs
