name: CI

on:
  push:
    branches: [ main ]
  # Stacked workstream PRs target the immediately preceding reviewed branch.
  # Verify every PR regardless of its base; pushes remain limited to main.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Run strict TypeScript check
        run: npx tsc --noEmit

      - name: Run test TypeScript check
        run: npm run typecheck:tests

      - name: Run Expo production export
        run: EXPO_NO_TELEMETRY=1 npx expo export -p web

  database:
    name: Database & Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Select Supabase image registry
        run: echo 'SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io' >> "$GITHUB_ENV"

      - name: Start Supabase local stack
        run: supabase start

      - name: Reset database and verify migrations
        run: supabase db reset

      - name: Verify six-digit email OTP sign-in
        run: node scripts/test-auth-otp-local.mjs

      - name: Run Supabase pgTAP database tests
        run: supabase test db

      - name: Run local integration E2E harness
        run: node scripts/test-i1-b1-local.mjs

      - name: Run local B2 routine integration E2E harness
        run: node scripts/test-i1-b2-local.mjs

      - name: Run S2 persistence API integration harness
        run: node scripts/test-s2-local.mjs

      - name: Run S3 intelligence Edge integration harness
        run: node scripts/test-s3-local.mjs

      - name: Run S4 founder operations integration harness
        run: node scripts/test-s4-local.mjs

      - name: Run S5 membership commerce integration harness
        run: node scripts/test-s5-local.mjs

      - name: Run E1 membership entitlement lifecycle harness
        run: node --experimental-strip-types scripts/test-e1-local.mjs

      - name: Run local B4B check-in context E2E harness
        run: node scripts/test-i1-b4b-local.mjs

      - name: Run catalog authenticated search E2E harness
        run: node scripts/test-catalog-local.mjs

      - name: Run S-FREE-1 anonymous access E2E harness
        run: node scripts/test-s-free-1-local.mjs

      - name: Run Wave-1 mobile free-access integration harness
        run: node --experimental-strip-types scripts/test-wave1-local.mjs
