project_id = "derive"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["derive://**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.prepare-onboarding]
enabled = true
verify_jwt = true
import_map = "./functions/prepare-onboarding/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/prepare-onboarding/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/prepare-onboarding/*.html" ]

[functions.onboard-customer]
enabled = true
verify_jwt = true
import_map = "./functions/onboard-customer/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/onboard-customer/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/onboard-customer/*.html" ]

[functions.photo-url]
enabled = true
verify_jwt = true
import_map = "./functions/photo-url/deno.json"
entrypoint = "./functions/photo-url/index.ts"

[functions.delete-customer-account]
enabled = true
verify_jwt = true
import_map = "./functions/delete-customer-account/deno.json"
entrypoint = "./functions/delete-customer-account/index.ts"

[functions.propose-routine]
enabled = true
verify_jwt = true
import_map = "./functions/propose-routine/deno.json"
entrypoint = "./functions/propose-routine/index.ts"
[functions.submit-checkin]
enabled = true
verify_jwt = true
import_map = "./functions/submit-checkin/deno.json"
entrypoint = "./functions/submit-checkin/index.ts"
