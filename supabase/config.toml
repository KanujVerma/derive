project_id = "derive"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["derive://**"]
enable_signup = true
# Local-only S-FREE-1 proof. Hosted anonymous Auth remains deliberately gated
# until the S-OPS-1 abuse/lifecycle release review.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
otp_length = 6

[auth.email.template.magic_link]
subject = "Your Derive access code"
content_path = "./supabase/templates/magic_link.html"

[functions.prepare-onboarding]
enabled = true
verify_jwt = true
import_map = "./functions/prepare-onboarding/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/prepare-onboarding/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/prepare-onboarding/*.html" ]

[functions.onboard-customer]
enabled = true
verify_jwt = true
import_map = "./functions/onboard-customer/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/onboard-customer/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/onboard-customer/*.html" ]

